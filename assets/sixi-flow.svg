<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sixi: measured security for AI agents — reach, attack, judge, prove, ship</title>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .core { fill: #fff8f0; stroke: #e36209; stroke-width: 2; }
    .step { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .q { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .repo { fill: #0969da; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 700; }
    .sub { fill: #57606a; font-size: 14px; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .kpi { fill: #1f2328; font-size: 26px; font-weight: 700; }
    .kpil { fill: #57606a; font-size: 12px; }
    .accent { fill: #e36209; }
    .rule { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .core { fill: #1f1610; stroke: #f0883e; }
      .step, .note, .sub, .kpil { fill: #8d96a0; }
      .q, .title, .kpi { fill: #e6edf3; }
      .repo { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .accent { fill: #f0883e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="400" rx="12"/>

  <text class="title" x="32" y="46">Sixi <tspan class="accent">·</tspan> measured security for AI agents</text>
  <text class="sub" x="32" y="70">Attack an agent, prove what really broke, and keep it from breaking again — in the open, with the raw data.</text>

  <!-- five stages -->
  <g>
    <rect class="card" x="32" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="48" y="122">1 · REACH</text>
    <text class="q" x="48" y="146">Talk to any agent</text>
    <text class="repo" x="48" y="174">redwire</text>
    <text class="note" x="48" y="194">REST · MCP · A2A · WS</text>
    <text class="note" x="48" y="220">upstream: PyRIT</text>
    <text class="note" x="48" y="236">A2ATarget (merged)</text>
  </g>
  <path class="arrow" d="M198,171 L214,171" marker-end="url(#a)"/>

  <g>
    <rect class="core" x="218" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="234" y="122">2 · ATTACK</text>
    <text class="q" x="234" y="146">Does it break?</text>
    <text class="repo" x="234" y="174">sixi-scanner</text>
    <text class="note" x="234" y="194">21 techniques, one Go</text>
    <text class="note" x="234" y="210">binary, no LLM inside</text>
    <text class="note" x="234" y="236">agent-redteam-labs</text>
  </g>
  <path class="arrow" d="M384,171 L400,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="404" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="420" y="122">3 · JUDGE</text>
    <text class="q" x="420" y="146">Did it really break?</text>
    <text class="repo" x="420" y="174">oracles + confirm</text>
    <text class="repo" x="420" y="194">laya-as-judge</text>
    <text class="note" x="420" y="220">code for business rules,</text>
    <text class="note" x="420" y="236">a model only when unsure</text>
  </g>
  <path class="arrow" d="M570,171 L586,171" marker-end="url(#a)"/>

  <g>
    <rect class="core" x="590" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="606" y="122">4 · PROVE</text>
    <text class="q" x="606" y="146">Who finds what?</text>
    <text class="repo" x="606" y="174">agent-redteam-</text>
    <text class="repo" x="606" y="190">benchmark</text>
    <text class="repo" x="606" y="214">agent-arena</text>
    <text class="note" x="606" y="236">scored from the wire</text>
  </g>
  <path class="arrow" d="M756,171 L772,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="776" y="96" width="152" height="150" rx="10"/>
    <text class="step" x="792" y="122">5 · SHIP</text>
    <text class="q" x="792" y="146">Every pull request</text>
    <text class="repo" x="792" y="174">scan-action@v2</text>
    <text class="note" x="792" y="194">SARIF → Security tab</text>
    <text class="note" x="792" y="220">unreachable ≠ clean</text>
  </g>

  <!-- loop back -->
  <path class="arrow" d="M852,248 L852,262 Q852,268 846,268 L122,268 Q116,268 116,262 L116,252" marker-end="url(#a)" stroke-dasharray="4 4"/>
  <text class="note" x="356" y="290">every fix is measured on the benchmark before it ships</text>

  <!-- KPIs -->
  <line class="rule" x1="32" y1="300" x2="928" y2="300"/>
  <text class="kpil" x="32" y="324">sixi-scanner v0.5.0 vs 6 tools, one real Microsoft Foundry agent</text>
  <g>
    <text class="kpi" x="32" y="366">0.452</text><text class="kpil" x="32" y="384">precision · 1st</text>
    <text class="kpi" x="208" y="366">0.750</text><text class="kpil" x="208" y="384">recall · 1st</text>
    <text class="kpi" x="384" y="366">$0.46</text><text class="kpil" x="384" y="384">cloud cost, full benchmark run</text>
    <text class="kpi" x="560" y="366">70–97%</text><text class="kpil" x="560" y="384">of tools' own flags were false</text>
    <text class="kpi" x="776" y="366">0</text><text class="kpil" x="776" y="384">dependencies · no telemetry</text>
  </g>
</svg>
